# Server: Tomcat with virtual threads (one per request), listening on 0.0.0.0:${PORT}.
server.port=${PORT:8080}
server.address=0.0.0.0
spring.threads.virtual.enabled=true
spring.main.banner-mode=off
# Filters use where[field][op]; browsers and k6 send the brackets unencoded, which Tomcat rejects by default.
server.tomcat.relaxed-query-chars=[,],|,{,},^
# Graceful stop well within the 10 seconds of `docker stop -t 10`.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
# Initialize the DispatcherServlet at startup, not on the first request.
spring.mvc.servlet.load-on-startup=1
# No static resources: unknown paths reach the 404 "Route not found" handler.
spring.web.resources.add-mappings=false
server.error.include-stacktrace=never
server.error.include-message=never

# Database: PostgreSQL through HikariCP, exactly DB_POOL_SIZE connections.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:bench}
spring.datasource.username=${DB_USER:bench}
spring.datasource.password=${DB_PASSWORD:bench}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:10}
spring.datasource.hikari.pool-name=bench

# Uploads: parsed in memory (the limit of 1 MiB is enforced by the handler, after type detection).
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
spring.servlet.multipart.file-size-threshold=2MB
app.upload-dir=${UPLOAD_DIR:uploads}

# No schema or data scripts: run.ts creates the schema and the seed.
spring.sql.init.mode=never
